<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Página não encontrada</title>
  <meta name="robots" content="noindex">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      line-height: 1.5;
    }
    .box { max-width: 460px; }
    .code { font-size: 64px; font-weight: 700; letter-spacing: -1px; margin: 0; color: #202124; }
    h1 { font-size: 20px; font-weight: 600; margin: 8px 0 10px; }
    p { font-size: 15px; margin: 0; color: #5f6368; }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que procura não está disponível.</p>
  </div>
</body>
</html>
